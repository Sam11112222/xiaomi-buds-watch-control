plugins { id 'com.android.application' }

android {
    namespace 'dev.budswatch'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.budswatch.earbuds'
        minSdk 26          // any Android-based watch; no Wear OS libraries needed
        targetSdk 34
        versionCode 3
        versionName '1.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
// The app and the ColorOS card use framework APIs only; the Wear OS Tile needs the Jetpack tile libraries.
dependencies {
    implementation 'androidx.wear.tiles:tiles:1.4.1'
    implementation 'androidx.wear.protolayout:protolayout:1.2.1'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
}
